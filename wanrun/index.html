<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>わんラン - 全天候対応ドッグランナビ</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet.js -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 外部CSSファイルを読み込み -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans pb-16">

  <!-- 通知トーストコンテナ -->
  <div id="toast-container" class="fixed top-2 inset-x-2 z-50 flex flex-col items-center pointer-events-none gap-1.5"></div>

  <!-- ヘッダー -->
  <header class="bg-white border-b sticky top-0 z-30 px-3 py-2 flex items-center justify-between shadow-xs">
    <div class="flex items-center space-x-1.5">
      <span class="text-xl">🐾</span>
      <div>
        <h1 class="font-bold text-sm leading-tight text-amber-700">わんラン</h1>
        <p class="text-[9px] text-slate-500">全天候・路面温度・スマート検索</p>
      </div>
    </div>

    <!-- 地域セレクター -->
    <select id="region-selector" onchange="changeRegion(this.value)" class="bg-slate-100 text-xs font-semibold py-1 px-2 rounded border border-slate-300 text-slate-700 focus:outline-none focus:ring-1 focus:ring-amber-500">
      <option value="130000,35.6812,139.7671">📍 東京 (都心)</option>
      <option value="140000,35.4437,139.6380">📍 神奈川 (横浜)</option>
      <option value="120000,35.6074,140.1065">📍 千葉 (幕張)</option>
      <option value="110000,35.8617,139.6455">📍 埼玉 (さいたま)</option>
      <option value="270000,34.6937,135.5023">📍 大阪</option>
      <option value="280000,34.6901,135.1955">📍 兵庫 (神戸)</option>
      <option value="260000,35.0116,135.7681">📍 京都</option>
      <option value="230000,35.1815,136.9066">📍 愛知 (名古屋)</option>
      <option value="016000,43.0642,141.3469">📍 北海道 (札幌)</option>
      <option value="400000,33.5904,130.4017">📍 福岡</option>
    </select>
  </header>

  <!-- 天候・気温シミュレータ設定パネル -->
  <div class="bg-slate-100 border-b border-slate-200">
    <div class="px-3 py-1 flex items-center justify-between text-xs">
      <span class="font-bold text-slate-700 flex items-center gap-1">🎛️ 天候・気温シミュレーター</span>
      <button onclick="toggleCustomWeatherPanel()" id="btn-toggle-custom" class="text-[10px] text-amber-700 font-bold hover:underline">
        手動で条件を変更 ▼
      </button>
    </div>

    <div id="custom-weather-panel" class="hidden px-3 pb-2 pt-1 border-t border-slate-200 bg-white text-xs space-y-2">
      <div class="flex items-center justify-between">
        <span class="font-medium text-slate-600">連動モード:</span>
        <div class="flex gap-1">
          <button onclick="setWeatherMode('auto')" id="mode-auto" class="px-2 py-0.5 rounded font-bold bg-amber-600 text-white text-[10px]">気象庁 自動連動</button>
          <button onclick="setWeatherMode('custom')" id="mode-custom" class="px-2 py-0.5 rounded bg-slate-100 border text-slate-700 text-[10px]">手動カスタム</button>
        </div>
      </div>

      <div id="custom-controls" class="space-y-1.5 opacity-50 pointer-events-none transition">
        <div class="flex items-center justify-between">
          <label class="text-slate-600">天候状態:</label>
          <div class="flex gap-1">
            <button onclick="setCustomCondition('clear')" class="weather-cond-btn px-2 py-0.5 rounded border text-[10px] bg-amber-50 border-amber-500 font-bold" data-cond="clear">☀️ 晴れ</button>
            <button onclick="setCustomCondition('rain')" class="weather-cond-btn px-2 py-0.5 rounded border text-[10px] bg-white" data-cond="rain">🌧️ 雨</button>
            <button onclick="setCustomCondition('cloudy')" class="weather-cond-btn px-2 py-0.5 rounded border text-[10px] bg-white" data-cond="cloudy">☁️ 曇り</button>
          </div>
        </div>

        <div class="flex items-center justify-between gap-2">
          <label class="text-slate-600 whitespace-nowrap">気温設定: <b id="val-temp" class="text-slate-800">22℃</b></label>
          <input type="range" id="input-temp" min="0" max="40" value="22" oninput="updateCustomValues()" class="w-2/3 accent-amber-600">
        </div>

        <div class="flex items-center justify-between gap-2">
          <label class="text-slate-600 whitespace-nowrap">降水確率: <b id="val-pop" class="text-slate-800">10%</b></label>
          <input type="range" id="input-pop" min="0" max="100" step="10" value="10" oninput="updateCustomValues()" class="w-2/3 accent-amber-600">
        </div>
      </div>
    </div>
  </div>

  <!-- 天候・路面温度バナー -->
  <section id="weather-banner" class="bg-slate-800 text-white px-3 py-1.5 text-xs space-y-1 transition-all">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-1.5">
        <span id="weather-icon" class="text-lg">☀️</span>
        <div>
          <span class="text-slate-400 text-[9px] block leading-none" id="weather-source-label">気象庁オープンデータ連動</span>
          <span id="weather-status" class="font-bold text-xs">晴れ</span>
        </div>
      </div>
      <div class="text-right text-[10px] text-slate-200">
        <span id="banner-temp">気温 22℃</span> / <span id="banner-pop">降水 10%</span>
      </div>
    </div>

    <div id="pavement-alert" class="pt-1 border-t border-white/15 flex items-center justify-between text-[10px]">
      <span class="font-medium flex items-center gap-1" id="pavement-status">
        🐾 <span>路面推定温度: 約34℃</span>
      </span>
      <span id="heat-badge" class="px-1.5 py-0.2 rounded font-bold text-[9px] bg-emerald-600 text-white">安全にお散歩可能</span>
    </div>
  </section>

  <!-- 自動提案・有無判定バナー -->
  <section id="proposal-banner" class="px-3 py-1.5 bg-amber-50 border-b border-amber-200 flex items-center gap-2 text-xs text-amber-900">
    <span class="text-lg flex-shrink-0" id="proposal-icon">💡</span>
    <div class="flex-1 min-w-0">
      <div class="font-bold truncate text-[11px]" id="proposal-title">周辺のドッグランを探索中...</div>
      <div class="text-[10px] text-amber-700 truncate" id="proposal-desc">条件に合うおすすめ施設をピックアップします。</div>
    </div>
  </section>

  <!-- 地図エリア -->
  <div class="relative">
    <div id="map"></div>

    <button onclick="refreshFacilities(currentLat, currentLng)" class="absolute top-2 left-2 z-10 bg-white/95 px-2.5 py-1 rounded shadow-xs border text-[11px] font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-1 active:scale-95 transition">
      🔄 <span>再取得</span>
    </button>

    <button id="btn-gps" onclick="getUserLocation()" class="absolute bottom-2 right-2 z-10 bg-white px-2.5 py-1.5 rounded-full shadow-md border border-slate-200 hover:bg-slate-50 active:scale-95 transition flex items-center gap-1" title="GPS現在地を取得">
      <span id="gps-icon">📍</span>
      <span id="gps-text" class="text-[11px] font-bold text-slate-700">現在地</span>
    </button>
  </div>

  <!-- 検索 & 優先順位コントロールバー -->
  <div class="sticky top-[41px] z-20 bg-white border-b shadow-xs space-y-1.5 py-1.5 px-3">
    <!-- キーワード検索 -->
    <div class="relative flex items-center">
      <span class="absolute left-2.5 text-slate-400 text-xs">🔍</span>
      <input
        id="search-input"
        type="text"
        placeholder="施設名、地名、公園名、カインズ、SAなど"
        oninput="handleSearchInput(this.value)"
        class="w-full pl-7 pr-7 py-1 text-xs bg-slate-100 border border-slate-200 rounded focus:bg-white focus:outline-none focus:ring-1 focus:ring-amber-500 transition"
      />
      <button
        id="clear-search-btn"
        onclick="clearSearch()"
        class="absolute right-2 text-slate-400 hover:text-slate-600 text-xs hidden p-0.5"
      >✕</button>
    </div>

    <!-- 距離範囲 ＆ 優先順位ソート -->
    <div class="flex items-center justify-between text-xs gap-1.5">
      <div class="flex items-center gap-1">
        <span class="text-slate-500 text-[10px] whitespace-nowrap">範囲:</span>
        <select id="distance-selector" onchange="setDistanceFilter(this.value)" class="bg-slate-100 border border-slate-300 rounded px-1 py-0.5 text-[10px] font-medium text-slate-700 focus:outline-none">
          <option value="5">5km以内</option>
          <option value="15">15km以内</option>
          <option value="30">30km以内</option>
          <option value="60" selected>60km以内</option>
          <option value="999">無制限</option>
        </select>
      </div>

      <div class="flex items-center gap-1">
        <span class="text-slate-500 text-[10px] whitespace-nowrap">優先:</span>
        <select id="priority-selector" onchange="setPrioritySort(this.value)" class="bg-amber-50 border border-amber-300 rounded px-1.5 py-0.5 text-[10px] font-bold text-amber-900 focus:outline-none">
          <option value="auto">🌤️ 天候自動最適化</option>
          <option value="dist">📏 距離が近い順</option>
          <option value="free">🆓 完全無料・公営</option>
          <option value="indoor">🏠 雨・猛暑(室内)</option>
          <option value="highway">🚗 高速SA/PA</option>
        </select>
      </div>
    </div>
  </div>

  <!-- リスト表示部 -->
  <main class="px-3 pt-2 space-y-2">
    <div class="flex items-center justify-between text-xs text-slate-500">
      <div class="flex items-center gap-1">
        <span class="font-bold text-slate-800 text-xs">見つかったドッグラン</span>
        <span id="data-source-badge" class="bg-slate-100 text-slate-600 px-1 py-0.2 rounded text-[9px] font-medium">即時表示</span>
      </div>
      <span id="result-count" class="font-bold text-amber-700 text-xs">0件</span>
    </div>

    <div id="loading-spinner" class="py-2 text-center space-y-1 hidden">
      <div class="inline-block w-3.5 h-3.5 border-2 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-[10px] text-slate-400">オンラインデータを追加検索中...</p>
    </div>

    <!-- 施設カード一覧 -->
    <div id="facility-list" class="space-y-1.5"></div>
  </main>

  <!-- 詳細モーダル -->
  <div id="detail-modal" class="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4 backdrop-blur-xs">
    <div class="bg-white w-full max-w-lg rounded-t-xl sm:rounded-xl max-h-[85vh] overflow-y-auto p-4 space-y-3 shadow-2xl">
      <div class="flex justify-between items-start">
        <div>
          <span id="m-type" class="text-[10px] font-bold text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">ドッグラン施設</span>
          <h2 id="m-name" class="text-base font-bold mt-1 text-slate-900 leading-snug">施設名</h2>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-light leading-none p-1">×</button>
      </div>

      <div class="bg-slate-50 p-3 rounded-lg text-xs space-y-1.5 border border-slate-200">
        <div class="flex justify-between"><span class="text-slate-500">📍 所在地</span><span id="m-address" class="font-medium text-slate-800 text-right">-</span></div>
        <div class="flex justify-between"><span class="text-slate-500">📏 距離</span><span id="m-distance" class="font-bold text-amber-700">-</span></div>
        <div class="flex justify-between"><span class="text-slate-500">⏰ 営業時間</span><span id="m-hours" class="font-bold text-slate-800">-</span></div>
        <div class="flex justify-between"><span class="text-slate-500">💰 利用料金</span><span id="m-fee" class="font-bold text-emerald-700">-</span></div>
      </div>

      <div class="pt-1">
        <a id="m-nav-btn" href="#" target="_blank" class="w-full py-2.5 bg-emerald-700 text-white rounded-lg font-bold text-xs hover:bg-emerald-800 transition flex items-center justify-center gap-1.5 shadow">
          🗺️ OpenStreetMapでルート案内を開く
        </a>
      </div>
    </div>
  </div>

  <!-- 外部JavaScriptファイルを読み込み -->
  <script src="app.js"></script>
</body>
</html>
